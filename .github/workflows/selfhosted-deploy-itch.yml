# À placer dans .github/workflows/itch-deploy.yml
name: Self-Hosted - Deploy to itch.io

on:
  workflow_run:
    workflows:
      - "Self-Hosted - Unity Build"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: [self-hosted, windows]
    timeout-minutes: 30

    env:
      ITCH_USER: ${{ vars.ITCH_USER || github.repository_owner }}
      ITCH_GAME: ${{ vars.ITCH_GAME || github.event.repository.name }}

    steps:

      # ============================================================
      # RÉCUPÉRER LA DERNIÈRE RELEASE
      # ============================================================

      - name: Récupérer le ZIP de la dernière release
        id: release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept        = "application/vnd.github+json"
          }

          Write-Host "========================================"
          Write-Host "Recherche de la dernière release..."
          Write-Host "Repository : $repo"
          Write-Host "========================================"

          # Récupérer la dernière release publiée
          $url = "https://api.github.com/repos/$repo/releases/latest"

          $release = Invoke-RestMethod `
            -Uri $url `
            -Headers $headers

          if ($null -eq $release) {
            throw "Impossible de récupérer la dernière release GitHub."
          }

          Write-Host "Release trouvée : $($release.tag_name)"
          Write-Host "Nom             : $($release.name)"

          # ========================================================
          # Récupérer le premier ZIP de la release
          # ========================================================

          $asset = $release.assets |
            Where-Object {
              $_.name -like "*.zip"
            } |
            Select-Object -First 1

          if ($null -eq $asset) {
            throw "Aucun fichier ZIP trouvé dans la release $($release.tag_name)."
          }

          Write-Host "ZIP trouvé : $($asset.name)"

          # ========================================================
          # Déterminer le channel itch.io
          # ========================================================

          $channel = switch -Wildcard ($asset.name) {

            "*StandaloneWindows64*" {
              "windows"
              break
            }

            "*StandaloneLinux64*" {
              "linux"
              break
            }

            "*StandaloneOSX*" {
              "osx"
              break
            }

            "*WebGL*" {
              "html5"
              break
            }

            "*Android*" {
              "android"
              break
            }

            default {
              throw "Plateforme non reconnue dans le nom du ZIP : $($asset.name)"
            }
          }

          # ========================================================
          # Version
          # ========================================================

          $version = $release.tag_name -replace '^v', ''

          # ========================================================
          # Télécharger le ZIP
          #
          # IMPORTANT :
          # On utilise directement $asset.name.
          # Aucun renommage n'est effectué.
          # ========================================================

          New-Item `
            -ItemType Directory `
            -Force `
            -Path dist | Out-Null

          $zip = Join-Path `
            $PWD `
            "dist\$($asset.name)"

          $downloadHeaders = @{
            Authorization = $headers.Authorization
            Accept        = "application/octet-stream"
          }

          Write-Host "Téléchargement : $($asset.name)"

          Invoke-WebRequest `
            -Uri $asset.url `
            -Headers $downloadHeaders `
            -OutFile $zip

          if (-not (Test-Path $zip)) {
            throw "Le ZIP n'a pas pu être téléchargé."
          }

          $zipFile = Get-Item $zip

          if ($zipFile.Length -le 0) {
            throw "Le ZIP téléchargé est vide."
          }

          Write-Host "========================================"
          Write-Host "Release  : $($release.tag_name)"
          Write-Host "ZIP      : $($asset.name)"
          Write-Host "Channel  : $channel"
          Write-Host "Version  : $version"
          Write-Host "========================================"

          # Outputs
          "zip=$zip" | Out-File `
            $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

          "zip_name=$($asset.name)" | Out-File `
            $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

          "channel=$channel" | Out-File `
            $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

          "version=$version" | Out-File `
            $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

      # ============================================================
      # INSTALLER BUTLER
      # ============================================================

      - name: Installer butler (si absent)
        shell: powershell
        run: |
          $dir = "$env:USERPROFILE\butler"

          if (-not (Test-Path "$dir\butler.exe")) {

            New-Item `
              -ItemType Directory `
              -Force `
              -Path $dir | Out-Null

            Invoke-WebRequest `
              -Uri "https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default" `
              -OutFile "$env:TEMP\butler.zip"

            Expand-Archive `
              -Path "$env:TEMP\butler.zip" `
              -DestinationPath $dir `
              -Force
          }

          "$dir" | Out-File `
            $env:GITHUB_PATH `
            -Append `
            -Encoding utf8

      # ============================================================
      # PUBLICATION ITCH.IO
      # ============================================================

      - name: Push vers itch.io
        shell: powershell
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler -V

          $target = "$env:ITCH_USER/$env:ITCH_GAME:${{ steps.release.outputs.channel }}"

          Write-Host "========================================"
          Write-Host "Publication itch.io"
          Write-Host "Target  : $target"
          Write-Host "ZIP     : ${{ steps.release.outputs.zip_name }}"
          Write-Host "Version : ${{ steps.release.outputs.version }}"
          Write-Host "========================================"

          butler push `
            "${{ steps.release.outputs.zip }}" `
            "$target" `
            --userversion "${{ steps.release.outputs.version }}"

          if ($LASTEXITCODE -ne 0) {
            throw "butler push a échoué (code $LASTEXITCODE)"
          }

          butler status "$env:ITCH_USER/$env:ITCH_GAME"

      # ============================================================
      # NETTOYAGE
      # ============================================================

      - name: Nettoyage
        if: always()
        shell: powershell
        run: |
          Remove-Item `
            -Recurse `
            -Force `
            dist `
            -ErrorAction SilentlyContinue
