# À placer dans .github/workflows/itch-deploy.yml
name: Self-Hosted - Deploy to itch.io

on:
  workflow_run:
    workflows:
      - "Self-Hosted - Unity Build"
    types:
      - completed

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à publier (vide = version du projet Unity)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: [self-hosted, windows]
    timeout-minutes: 30

    env:
      ITCH_USER: ${{ vars.ITCH_USER || github.repository_owner }}
      ITCH_GAME: ${{ vars.ITCH_GAME || github.event.repository.name }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout du projet Unity
        uses: actions/checkout@v4
        with:
          lfs: true
          clean: false
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      # ============================================================
      # INFORMATIONS UNITY
      # ============================================================

      - name: Récupérer les informations du projet Unity
        id: unity_info
        shell: powershell
        run: |
          $projectSettingsFile = "ProjectSettings/ProjectSettings.asset"

          if (-not (Test-Path $projectSettingsFile)) {
            throw "Fichier $projectSettingsFile introuvable."
          }

          # ========================================================
          # Product Name
          # ========================================================

          $productNameMatches = Select-String `
            -Path $projectSettingsFile `
            -Pattern '^\s*productName:\s*(.+)$'

          if ($productNameMatches.Count -eq 0) {
            throw "Impossible de récupérer productName depuis $projectSettingsFile."
          }

          $productName = $productNameMatches[0].Matches[0].Groups[1].Value.Trim()
          $productName = $productName.Trim('"')

          if ([string]::IsNullOrWhiteSpace($productName)) {
            throw "Le Product Name Unity est vide."
          }

          # Nettoyage des caractères interdits Windows
          $invalidCharacters = [System.IO.Path]::GetInvalidFileNameChars()

          foreach ($character in $invalidCharacters) {
            $productName = $productName.Replace($character, '_')
          }

          $productName = $productName.TrimEnd(' ', '.')

          # ========================================================
          # Bundle Version
          # ========================================================

          $bundleVersionMatches = Select-String `
            -Path $projectSettingsFile `
            -Pattern '^\s*bundleVersion:\s*(.+)$'

          if ($bundleVersionMatches.Count -eq 0) {
            throw "Impossible de récupérer bundleVersion depuis $projectSettingsFile."
          }

          $bundleVersion = $bundleVersionMatches[0].Matches[0].Groups[1].Value.Trim()
          $bundleVersion = $bundleVersion.Trim('"')

          if ([string]::IsNullOrWhiteSpace($bundleVersion)) {
            throw "La Bundle Version Unity est vide."
          }

          # ========================================================
          # Tag
          # ========================================================

          $inputTag = "${{ inputs.tag }}"

          if (
            "${{ github.event_name }}" -eq "workflow_dispatch" -and
            -not [string]::IsNullOrWhiteSpace($inputTag)
          ) {
            $tag = $inputTag

            if (-not $tag.StartsWith("v")) {
              $tag = "v$tag"
            }
          }
          else {
            $tag = "v$bundleVersion"
          }

          Write-Host "========================================"
          Write-Host "Product Name  : $productName"
          Write-Host "Bundle Version: $bundleVersion"
          Write-Host "Tag           : $tag"
          Write-Host "========================================"

          "product_name=$productName" | Out-File `
            $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

          "bundle_version=$bundleVersion" | Out-File `
            $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

          "tag=$tag" | Out-File `
            $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

      # ============================================================
      # RÉCUPÉRER LA RELEASE
      # ============================================================

      - name: Récupérer la release GitHub
        id: rel
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "${{ steps.unity_info.outputs.tag }}"

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
          }

          Write-Host "========================================"
          Write-Host "Recherche de la release"
          Write-Host "Repository : $repo"
          Write-Host "Tag        : $tag"
          Write-Host "========================================"

          # ========================================================
          # Récupérer toutes les releases
          #
          # On utilise /releases plutôt que /releases/tags/$tag
          # afin d'être plus robuste avec workflow_run.
          # ========================================================

          $releasesUrl = "https://api.github.com/repos/$repo/releases?per_page=100"

          $releases = Invoke-RestMethod `
            -Uri $releasesUrl `
            -Headers $headers

          if ($null -eq $releases) {
            throw "Impossible de récupérer les releases GitHub."
          }

          # ========================================================
          # Chercher la release correspondant au tag
          # ========================================================

          $release = $releases |
            Where-Object {
              $_.tag_name -eq $tag
            } |
            Select-Object -First 1

          if ($null -eq $release) {
            Write-Host "Releases disponibles :"

            foreach ($availableRelease in $releases) {
              Write-Host " - $($availableRelease.tag_name)"
            }

            throw "Aucune release trouvée pour le tag $tag."
          }

          Write-Host "Release trouvée : $($release.tag_name)"
          Write-Host "Nom             : $($release.name)"

          # ========================================================
          # Récupérer le ZIP
          # ========================================================

          $asset = $release.assets |
            Where-Object {
              $_.name -like "*.zip"
            } |
            Select-Object -First 1

          if ($null -eq $asset) {
            throw "Aucun fichier ZIP trouvé dans la release $($release.tag_name)."
          }

          Write-Host "Asset trouvé : $($asset.name)"

          # ========================================================
          # Déterminer la plateforme
          # ========================================================

          $channel = switch -Wildcard ($asset.name) {

            "*StandaloneWindows64*" {
              "windows"
              break
            }

            "*StandaloneLinux64*" {
              "linux"
              break
            }

            "*StandaloneOSX*" {
              "osx"
              break
            }

            "*WebGL*" {
              "html5"
              break
            }

            "*Android*" {
              "android"
              break
            }

            default {
              throw "Plateforme non reconnue dans le nom du ZIP : $($asset.name)"
            }
          }

          # ========================================================
          # Vérification du nom attendu
          # ========================================================

          $productName = "${{ steps.unity_info.outputs.product_name }}"
          $bundleVersion = "${{ steps.unity_info.outputs.bundle_version }}"

          if ($asset.name -like "*StandaloneWindows64*") {
            $buildTarget = "StandaloneWindows64"
          }
          elseif ($asset.name -like "*StandaloneLinux64*") {
            $buildTarget = "StandaloneLinux64"
          }
          elseif ($asset.name -like "*StandaloneOSX*") {
            $buildTarget = "StandaloneOSX"
          }
          elseif ($asset.name -like "*WebGL*") {
            $buildTarget = "WebGL"
          }
          elseif ($asset.name -like "*Android*") {
            $buildTarget = "Android"
          }
          else {
            throw "Impossible de déterminer le Build Target."
          }

          $expectedZipName = "$productName-$buildTarget-v$bundleVersion.zip"

          Write-Host "========================================"
          Write-Host "ZIP de la release : $($asset.name)"
          Write-Host "ZIP attendu       : $expectedZipName"
          Write-Host "========================================"

          if ($asset.name -ne $expectedZipName) {
            Write-Warning "Le nom du ZIP GitHub ne correspond pas exactement au nom attendu."

            Write-Warning "ZIP GitHub : $($asset.name)"
            Write-Warning "Attendu    : $expectedZipName"

            # On utilise volontairement le vrai nom du ZIP GitHub.
            # Cela garantit que le fichier envoyé à itch.io est
            # exactement celui de la release.
          }

          # ========================================================
          # Télécharger le ZIP
          # ========================================================

          New-Item `
            -ItemType Directory `
            -Force `
            -Path dist | Out-Null

          $zip = Join-Path `
            $PWD `
            "dist\$($asset.name)"

          $downloadHeaders = @{
            Authorization = $headers.Authorization
            Accept = "application/octet-stream"
          }

          Write-Host "Téléchargement de : $($asset.name)"

          Invoke-WebRequest `
            -Uri $asset.url `
            -Headers $downloadHeaders `
            -OutFile $zip

          if (-not (Test-Path $zip)) {
            throw "Le ZIP n'a pas pu être téléchargé."
          }

          $zipFile = Get-Item $zip

          if ($zipFile.Length -le 0) {
            throw "Le ZIP téléchargé est vide."
          }

          # ========================================================
          # Outputs
          # ========================================================

          "zip=$zip" | Out-File `
            $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

          "zip_name=$($asset.name)" | Out-File `
            $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

          "channel=$channel" | Out-File `
            $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

          "version=$bundleVersion" | Out-File `
            $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

      # ============================================================
      # BUTLER
      # ============================================================

      - name: Installer butler (si absent)
        shell: powershell
        run: |
          $dir = "$env:USERPROFILE\butler"

          if (-not (Test-Path "$dir\butler.exe")) {

            New-Item `
              -ItemType Directory `
              -Force `
              -Path $dir | Out-Null

            Invoke-WebRequest `
              -Uri "https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default" `
              -OutFile "$env:TEMP\butler.zip"

            Expand-Archive `
              -Path "$env:TEMP\butler.zip" `
              -DestinationPath $dir `
              -Force
          }

          "$dir" | Out-File `
            $env:GITHUB_PATH `
            -Append `
            -Encoding utf8

      # ============================================================
      # PUSH ITCH.IO
      # ============================================================

      - name: Push vers itch.io
        shell: powershell
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |

          butler -V

          $target = "$env:ITCH_USER/$env:ITCH_GAME" + ":" + "${{ steps.rel.outputs.channel }}"

          Write-Host "========================================"
          Write-Host "Publication itch.io"
          Write-Host "Target  : $target"
          Write-Host "ZIP     : ${{ steps.rel.outputs.zip_name }}"
          Write-Host "Version : ${{ steps.rel.outputs.version }}"
          Write-Host "========================================"

          butler push `
            "${{ steps.rel.outputs.zip }}" `
            "$target" `
            --userversion "${{ steps.rel.outputs.version }}"

          if ($LASTEXITCODE -ne 0) {
            throw "butler push a échoué (code $LASTEXITCODE)"
          }

          butler status "$env:ITCH_USER/$env:ITCH_GAME"

      # ============================================================
      # NETTOYAGE
      # ============================================================

      - name: Nettoyage
        if: always()
        shell: powershell
        run: |
          Remove-Item `
            -Recurse `
            -Force `
            dist `
            -ErrorAction SilentlyContinue
