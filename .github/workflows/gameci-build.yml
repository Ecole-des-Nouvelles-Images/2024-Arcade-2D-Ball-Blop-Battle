# À placer dans .github/workflows/gameci-build.yml
name: Unity Build (GameCI)

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64   # ajoute Android, StandaloneLinux64, WebGL... si besoin

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}  # uniquement si tu récupères un jour un .ulf
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          # unityVersion: auto  # lu depuis ProjectSettings/ProjectVersion.txt

      - name: Zip du build
        id: package
        shell: powershell
        run: |
          $tag = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "0.0.${{ github.run_number }}" }
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
 
          $zip = "MinMax-$env:BUILD_TARGET-$tag.zip"
          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          Compress-Archive -Path Build\* -DestinationPath $zip
 
          "tag=$tag"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip=$zip"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
 
      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: ${{ steps.package.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.zip }}

      - uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
