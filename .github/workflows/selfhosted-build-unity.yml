# À placer dans .github/workflows/unity-build.yml
name: Self-Hosted - Unity Build

on:
  # push:
  #   branches:
  #     - main

  workflow_dispatch:
    inputs:
      prerelease:
        description: "Marquer la release comme pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, windows]
    timeout-minutes: 90

    env:
      BUILD_TARGET: StandaloneWindows64
      # Pour Android signé, décommente et crée les secrets :
      # ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      # ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          clean: false
          fetch-depth: 0

      - name: Vérifier si la version Unity a changé
        id: version_check
        shell: powershell
        run: |
          # Un lancement manuel force toujours le build
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            Write-Host "Workflow lancé manuellement."
            Write-Host "Le build sera forcé."

            "should_build=true" | Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

            exit 0
          }

          $currentSettingsFile = "ProjectSettings/ProjectSettings.asset"

          if (-not (Test-Path $currentSettingsFile)) {
            throw "Fichier $currentSettingsFile introuvable."
          }

          # Récupérer la version actuelle
          $currentVersionMatches = Select-String `
            -Path $currentSettingsFile `
            -Pattern '^\s*bundleVersion:\s*(.+)$'

          if ($currentVersionMatches.Count -eq 0) {
            throw "Impossible de récupérer bundleVersion depuis $currentSettingsFile."
          }

          $currentVersion = $currentVersionMatches[0].Matches[0].Groups[1].Value.Trim()
          $currentVersion = $currentVersion.Trim('"')

          if ([string]::IsNullOrWhiteSpace($currentVersion)) {
            throw "La version Unity actuelle est vide."
          }

          # SHA avant le push
          $beforeSha = "${{ github.event.before }}"
          $currentSha = "${{ github.sha }}"

          # Cas particulier : premier push / historique inexistant
          if (
            [string]::IsNullOrWhiteSpace($beforeSha) -or
            $beforeSha -eq "0000000000000000000000000000000000000000"
          ) {
            Write-Host "Impossible de déterminer la version précédente."
            Write-Host "Le build sera effectué."

            "should_build=true" | Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

            exit 0
          }

          Write-Host "Commit précédent : $beforeSha"
          Write-Host "Commit actuel    : $currentSha"
          Write-Host "Version actuelle : $currentVersion"

          # Récupérer ProjectSettings.asset du commit précédent
          $previousSettingsContent = git show "$beforeSha`:ProjectSettings/ProjectSettings.asset" 2>$null

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($previousSettingsContent)) {
            Write-Host "Impossible de récupérer ProjectSettings.asset du commit précédent."
            Write-Host "Le build sera effectué."

            "should_build=true" | Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

            exit 0
          }

          # Extraire la version précédente
          $previousVersionMatch = [regex]::Match(
            $previousSettingsContent,
            '(?m)^\s*bundleVersion:\s*(.+)$'
          )

          if (-not $previousVersionMatch.Success) {
            Write-Host "Impossible de récupérer bundleVersion du commit précédent."
            Write-Host "Le build sera effectué."

            "should_build=true" | Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

            exit 0
          }

          $previousVersion = $previousVersionMatch.Groups[1].Value.Trim()
          $previousVersion = $previousVersion.Trim('"')

          Write-Host "Version précédente : $previousVersion"
          Write-Host "Version actuelle   : $currentVersion"

          if ($previousVersion -eq $currentVersion) {
            Write-Host "========================================"
            Write-Host "La bundleVersion n'a pas changé."
            Write-Host "Aucun build Unity nécessaire."
            Write-Host "========================================"

            "should_build=false" | Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8
          }
          else {
            Write-Host "========================================"
            Write-Host "La bundleVersion a changé !"
            Write-Host "$previousVersion -> $currentVersion"
            Write-Host "Le build Unity va être effectué."
            Write-Host "========================================"

            "should_build=true" | Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8
          }

      - name: Récupérer les informations du projet Unity
        id: unity_version
        if: steps.version_check.outputs.should_build == 'true'
        shell: powershell
        run: |
          $projectVersionFile = "ProjectSettings/ProjectVersion.txt"

          if (-not (Test-Path $projectVersionFile)) {
            throw "Fichier $projectVersionFile introuvable."
          }

          $editorVersionMatches = Select-String `
            -Path $projectVersionFile `
            -Pattern '^m_EditorVersion: (.+)$'

          if ($editorVersionMatches.Count -eq 0) {
            throw "Impossible de récupérer la version de l'éditeur Unity."
          }

          $editorVersion = $editorVersionMatches[0].Matches[0].Groups[1].Value.Trim()

          if ([string]::IsNullOrWhiteSpace($editorVersion)) {
            throw "La version de l'éditeur Unity est vide."
          }

          $projectSettingsFile = "ProjectSettings/ProjectSettings.asset"

          if (-not (Test-Path $projectSettingsFile)) {
            throw "Fichier $projectSettingsFile introuvable."
          }

          # Récupérer la version du jeu
          $bundleVersionMatches = Select-String `
            -Path $projectSettingsFile `
            -Pattern '^\s*bundleVersion:\s*(.+)$'

          if ($bundleVersionMatches.Count -eq 0) {
            throw "Impossible de récupérer la version du jeu depuis ProjectSettings.asset."
          }

          $bundleVersion = $bundleVersionMatches[0].Matches[0].Groups[1].Value.Trim()
          $bundleVersion = $bundleVersion.Trim('"')

          if ([string]::IsNullOrWhiteSpace($bundleVersion)) {
            throw "La version du jeu est vide."
          }

          if ($bundleVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version du jeu invalide : '$bundleVersion'. Format attendu : X.Y.Z"
          }

          # Récupérer le Product Name
          $productNameMatches = Select-String `
            -Path $projectSettingsFile `
            -Pattern '^\s*productName:\s*(.+)$'

          if ($productNameMatches.Count -eq 0) {
            throw "Impossible de récupérer le Product Name depuis ProjectSettings.asset."
          }

          $productName = $productNameMatches[0].Matches[0].Groups[1].Value.Trim()
          $productName = $productName.Trim('"')

          if ([string]::IsNullOrWhiteSpace($productName)) {
            throw "Le Product Name est vide."
          }

          # Nettoyer le Product Name pour les noms de fichiers Windows
          $invalidCharacters = [System.IO.Path]::GetInvalidFileNameChars()

          foreach ($character in $invalidCharacters) {
            $productName = $productName.Replace($character, '_')
          }

          $productName = $productName.TrimEnd(' ', '.')

          if ([string]::IsNullOrWhiteSpace($productName)) {
            throw "Le Product Name est invalide après nettoyage."
          }

          Write-Host "========================================"
          Write-Host "Unity Editor : $editorVersion"
          Write-Host "Game Version : $bundleVersion"
          Write-Host "Product Name : $productName"
          Write-Host "========================================"

          "editor_version=$editorVersion" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

          "bundle_version=$bundleVersion" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

          "product_name=$productName" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

      - name: Build Unity
        if: steps.version_check.outputs.should_build == 'true'
        shell: powershell
        run: |
          $version = "${{ steps.unity_version.outputs.editor_version }}"
          $gameVersion = "${{ steps.unity_version.outputs.bundle_version }}"
          $productName = "${{ steps.unity_version.outputs.product_name }}"

          $unity = "C:\Program Files\Unity\Hub\Editor\$version\Editor\Unity.exe"

          if (-not (Test-Path $unity)) {
            throw "Unity $version introuvable sur le runner : installe-la via le Hub"
          }

          Remove-Item `
            -Recurse `
            -Force `
            Build `
            -ErrorAction SilentlyContinue

          Remove-Item `
            -Force `
            build.log `
            -ErrorAction SilentlyContinue

          $unityArgs = @(
            '-batchmode',
            '-nographics',
            '-quit',
            '-projectPath', "`"$PWD`"",
            '-buildTarget', $env:BUILD_TARGET,
            '-executeMethod', 'BuildScript.Build',
            '-customBuildPath', 'Build',
            '-logFile', 'build.log'
          )

          Write-Host "Unity Editor : $version"
          Write-Host "Game Version : $gameVersion"
          Write-Host "Product Name : $productName"
          Write-Host "Build Target : $env:BUILD_TARGET"

          $p = Start-Process `
            -FilePath $unity `
            -ArgumentList $unityArgs `
            -Wait `
            -PassThru `
            -NoNewWindow

          Get-Content `
            build.log `
            -Tail 150 `
            -ErrorAction SilentlyContinue

          if ($p.ExitCode -ne 0) {
            throw "Build Unity échoué (code $($p.ExitCode)) - voir l'artefact build-log"
          }

      - name: Zip du build
        id: package
        if: steps.version_check.outputs.should_build == 'true'
        shell: powershell
        run: |
          $version = "${{ steps.unity_version.outputs.bundle_version }}"
          $productName = "${{ steps.unity_version.outputs.product_name }}"
          $tag = "v$version"

          if (-not (Test-Path "Build")) {
            throw "Le dossier Build n'existe pas après le build Unity."
          }

          $zip = "$productName-$env:BUILD_TARGET-$tag.zip"
          $releaseName = "$productName-$tag"

          Remove-Item `
            -Force `
            $zip `
            -ErrorAction SilentlyContinue

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            "$PWD\Build",
            "$PWD\$zip"
          )

          Write-Host "========================================"
          Write-Host "Product Name : $productName"
          Write-Host "Version      : $version"
          Write-Host "Tag          : $tag"
          Write-Host "Release Name : $releaseName"
          Write-Host "ZIP          : $zip"
          Write-Host "========================================"

          "version=$version" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

          "tag=$tag" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

          "zip=$zip" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

          "release_name=$releaseName" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Append `
            -Encoding utf8

      - name: Créer ou mettre à jour la release GitHub
        if: steps.version_check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: ${{ steps.package.outputs.release_name }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.zip }}
          overwrite_files: true

      - uses: actions/upload-artifact@v4
        if: steps.version_check.outputs.should_build == 'true'
        with:
          name: build-${{ env.BUILD_TARGET }}
          path: Build

      - uses: actions/upload-artifact@v4
        if: always() && steps.version_check.outputs.should_build == 'true'
        with:
          name: build-log
          path: build.log
